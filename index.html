<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>9BALL ビリヤード (Three.js)</title>
<style>
:root{--bg:#ebe5db;--fg:#5a4636;--panel:rgba(255,255,255,.84);--panel-fg:#2c2118;--bd:rgba(128,110,90,.35);--accent:#ff6b6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0a07;--fg:#c9b8a3;--panel:rgba(24,18,13,.84);--panel-fg:#eee3d4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0a07;--fg:#c9b8a3;--panel:rgba(24,18,13,.84);--panel-fg:#eee3d4;color-scheme:dark}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
#w{position:fixed;inset:0;width:100vw;height:100dvh;touch-action:none;cursor:grab;overflow:hidden}
#w.force-land{top:50%;left:50%;right:auto;bottom:auto;width:100dvh;height:100vw;transform:translate(-50%,-50%) rotate(90deg)}
#w:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
#topBar,#views,#hud,#spinWrap,#uiToggle{transition:opacity .22s ease,visibility .22s ease}
#w.fx-playing #topBar,#w.fx-playing #spinWrap,
#w.result-open #topBar,#w.result-open #spinWrap,
#w.menu-open #topBar,#w.menu-open #spinWrap{opacity:0;visibility:hidden;pointer-events:none}
#w.ui-hidden #views,#w.ui-hidden #hud{opacity:0;visibility:hidden;pointer-events:none}

/* 上部統合バー（必ず横並び：ボタン群 ＋ 現状表示 ＋ スマホ用非表示ボタン） */
#topBar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;z-index:2;pointer-events:none;flex-wrap:nowrap}
#views,#hud,#uiToggle{pointer-events:auto}
#views{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:nowrap}
#views button,#spinBtns button,#spinToggle,#uiToggle{appearance:none;border:1px solid var(--bd);background:var(--panel);color:var(--panel-fg);border-radius:8px;font:600 12px/1.2 inherit;padding:7px 10px;cursor:pointer;backdrop-filter:blur(8px);user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
#vRot90{padding:6px 8px}
#views button.on,.mSeg button.on{background:#2d7a64;color:#fff;border-color:rgba(45,122,100,.9)}
#views button:disabled{opacity:.3;cursor:not-allowed;filter:none}
#views button:not(:disabled):hover,#spinBtns button:hover,#spinToggle:hover,#uiToggle:hover{filter:brightness(1.08)}

/* 状況表示バー */
#hud{flex:0 0 660px;margin:0 auto;height:44px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:12px;border:1px solid var(--bd);background:var(--panel);color:var(--panel-fg);backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(0,0,0,.2);min-width:0}
#hud.win{cursor:pointer}
#turnBadge{padding:4px 9px;border-radius:6px;font:700 12px/1.2 inherit;color:#fff;background:#1e6b58;flex-shrink:0;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#targetBadge{display:flex;align-items:center;gap:5px;font:700 12px/1 inherit;flex-shrink:0}
#nextBallCanvas{width:32px;height:32px;flex-shrink:0}
#msg{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* スマホ専用 UI非表示トグルボタン */
#uiToggle{display:none;flex-shrink:0;width:34px;height:34px;padding:0;border-radius:8px;margin-left:auto}
body.is-mobile #uiToggle{display:inline-flex}
#w.ui-hidden #uiToggle{opacity:.5}

@media (max-width:1050px), (max-height:540px){
  #topBar{gap:6px}
  #views{gap:4px}
  #views button{padding:5px 7px;font-size:11px;border-radius:7px}
  #vRot90{padding:4px 6px}
  #hud{flex:1 1 0;margin:0;height:34px;padding:0 9px;gap:6px;border-radius:9px}
  #turnBadge{padding:3px 7px;font-size:11px;max-width:74px}
  #nextBallCanvas{width:24px;height:24px}
  #targetBadge{font-size:11px;gap:4px}
  #msg{font-size:11px}
}
#w.force-land #topBar{gap:6px}
#w.force-land #views{gap:4px}
#w.force-land #views button{padding:5px 7px;font-size:11px;border-radius:7px}
#w.force-land #vRot90{padding:4px 6px}
#w.force-land #hud{flex:1 1 0;margin:0;height:34px;padding:0 9px;gap:6px;border-radius:9px}
#w.force-land #turnBadge{padding:3px 7px;font-size:11px;max-width:74px}
#w.force-land #nextBallCanvas{width:24px;height:24px}
#w.force-land #targetBadge{font-size:11px;gap:4px}
#w.force-land #msg{font-size:11px}

/* 右端：スライド式 撞点（スピン）調整ドロワー */
#spinWrap{position:absolute;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;z-index:2;transform:translateX(calc(100% - 38px));transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .22s ease,visibility .22s ease}
#spinWrap.open{transform:translateX(0)}
#spinToggle{width:38px;height:62px;padding:0;font-size:15px;font-weight:800;border-radius:12px 0 0 12px;border-right:none;box-shadow:-3px 4px 14px rgba(0,0,0,.22);flex-shrink:0}
#spinBox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px calc(14px + env(safe-area-inset-right,0px)) 12px 14px;border-radius:16px 0 0 16px;border:1px solid var(--bd);border-right:none;background:var(--panel);backdrop-filter:blur(8px);box-shadow:-6px 6px 22px rgba(0,0,0,.24);pointer-events:none}
#spinWrap.open #spinBox{pointer-events:auto}
#spinTitle{font-size:11px;font-weight:700;letter-spacing:.08em;opacity:.75}
#spin{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0%,#ece6da 68%,#cfc6b6 100%);border:1px solid rgba(100,85,70,.55);position:relative;cursor:crosshair;box-shadow:inset 0 -4px 10px rgba(0,0,0,.15),0 3px 10px rgba(0,0,0,.22);touch-action:none}
#spin::before,#spin::after{content:"";position:absolute;background:rgba(90,75,60,.18);pointer-events:none}
#spin::before{left:50%;top:10%;width:1px;height:80%;transform:translateX(-.5px)}
#spin::after{top:50%;left:10%;height:1px;width:80%;transform:translateY(-.5px)}
#spinRing{position:absolute;inset:14%;border-radius:50%;border:1px dashed rgba(90,75,60,.25);pointer-events:none}
#dot{width:14px;height:14px;border-radius:50%;background:#c82222;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
#spinBtns{display:flex;align-items:center;gap:4px}
#spinBtns button{padding:5px 7px;font-size:11px;min-width:26px;border-radius:6px}
@media (max-width:640px),(max-height:540px){
  #spinWrap{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  #spinBox{padding:8px calc(10px + env(safe-area-inset-right,0px)) 8px 10px;gap:5px}
  #spin{width:86px;height:86px}
  #spinBtns button{padding:4px 6px;min-width:22px;font-size:10px}
}

/* メニュー画面 */
#menuOverlay{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow-y:auto;background:#1e1711}
#menuOverlay.open{display:flex}
#menuOverlay.no-bg{background:rgba(24,18,13,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#menuBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none}
#menuVignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(20,15,11,.40),rgba(10,8,5,.78))}
#menuOverlay.no-bg #menuVignette{display:none}
.mScr{position:relative;z-index:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:min(540px,100%);margin:auto;animation:mFade .2s ease-out}
.mScr.on{display:flex}
@keyframes mFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.title9{margin:0 0 34px;font-size:clamp(54px,11vw,92px);font-weight:900;letter-spacing:.18em;padding-left:.18em;color:#fff;text-shadow:4px 5px 0 var(--accent),0 10px 28px rgba(0,0,0,.5)}
.titleSm{margin:0 0 18px;font-size:clamp(24px,4.4vw,34px);font-weight:900;letter-spacing:.14em;padding-left:.14em;color:#fff;text-shadow:2px 3px 0 var(--accent),0 6px 18px rgba(0,0,0,.45)}
.mStack{display:flex;flex-direction:column;align-items:center;gap:11px;width:100%}
.pill{appearance:none;border:2px solid transparent;border-radius:999px;font:800 15px/1.2 inherit;letter-spacing:.08em;cursor:pointer;transition:transform .12s ease,filter .15s ease,background .15s ease,border-color .15s ease,color .15s ease,opacity .15s ease;user-select:none;-webkit-user-select:none;min-width:210px;padding:13px 34px}
.pill:active:not(:disabled){transform:scale(.97)}
.pill-pink{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 22px rgba(255,107,107,.35)}
.pill-pink:hover:not(:disabled){filter:brightness(1.08)}
.pill-pink:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.pill-outline{background:rgba(30,24,18,.48);border-color:rgba(255,255,255,.45);color:rgba(255,255,255,.92);backdrop-filter:blur(4px)}
.pill-outline:hover{border-color:rgba(255,255,255,.85);background:rgba(255,255,255,.12)}
.pill-dim{background:rgba(30,24,18,.42);border-color:rgba(255,255,255,.32);color:rgba(255,255,255,.45);backdrop-filter:blur(4px)}
.pill-dim.ready{border-color:rgba(255,255,255,.82);color:#fff;background:rgba(255,255,255,.14)}
.mSubLabel{font-size:12px;font-weight:600;color:rgba(255,255,255,.72);margin:12px 0 6px;letter-spacing:.03em}
.mSubLabel.tight{margin:6px 0 6px}
.roomRow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.roomIn{width:146px;height:48px;box-sizing:border-box;border-radius:14px;border:2px solid rgba(255,255,255,.82);background:rgba(32,26,20,.58);color:#fff;text-align:center;font:800 20px/1 inherit;letter-spacing:.34em;padding-left:.34em;outline:none;backdrop-filter:blur(4px)}
.roomIn::placeholder{color:rgba(255,255,255,.4);letter-spacing:.26em}
.roomIn:focus{border-color:var(--accent)}
.roomBtn{min-width:146px;height:48px;padding:0 20px;font-size:14px}
#netStatus{min-height:18px;margin-top:8px;font-size:12px;font-weight:600;color:#ffd8d8;letter-spacing:.03em}
.mFoot{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:10px}
.mLink{appearance:none;background:none;border:none;color:rgba(255,255,255,.82);font:700 14px/1.2 inherit;letter-spacing:.08em;padding:8px 16px;cursor:pointer}
.mLink:hover{color:#fff}

/* 部屋ロビー */
.lobbyNum{font-size:clamp(38px,7vw,58px);font-weight:900;letter-spacing:.24em;padding-left:.24em;color:#fff;margin:2px 0 14px;text-shadow:0 4px 18px rgba(0,0,0,.45)}
.slotGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(440px,100%);margin-bottom:12px}
.slot{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;border:2px solid rgba(255,255,255,.82);background:rgba(28,22,17,.45);color:#fff;font-size:13px;font-weight:600;backdrop-filter:blur(4px);text-align:left;min-width:0}
.slot.wait{border-style:dashed;border-color:rgba(255,255,255,.32);color:rgba(255,255,255,.55);background:rgba(28,22,17,.22)}
.slotDot{width:20px;height:13px;border-radius:5px;flex-shrink:0;background:rgba(255,255,255,.22)}
.slotTag{font-weight:800;font-size:14px;flex-shrink:0}
.slotRole{font-size:12px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* オプション＆個人設定 */
.optRow{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;margin:5px 0}
.optSeg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.optSeg button{appearance:none;border:2px solid rgba(255,255,255,.35);background:rgba(30,24,18,.48);color:rgba(255,255,255,.88);border-radius:999px;padding:7px 16px;font:700 12px/1.2 inherit;cursor:pointer}
.optSeg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.nameIn{width:min(250px,80%);height:44px;box-sizing:border-box;border-radius:12px;border:2px solid rgba(255,255,255,.78);background:rgba(32,26,20,.62);color:#fff;text-align:center;font:700 16px/1 inherit;letter-spacing:.06em;outline:none;padding:0 14px}
.nameIn:focus{border-color:var(--accent)}
.swatchRow{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;max-width:340px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.35);cursor:pointer;padding:0;transition:transform .12s ease,border-color .15s ease}
.sw.on{border-color:#fff;transform:scale(1.16);box-shadow:0 0 12px rgba(255,255,255,.45)}
.colorPick{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.65);background:none;padding:0;cursor:pointer;overflow:hidden}
.colorPick::-webkit-color-swatch-wrapper{padding:0}
.colorPick::-webkit-color-swatch{border:none;border-radius:50%}

/* ポケットインの靄とタイトル（ボールと重ならないよう上部配置） */
#mist{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .35s ease;background:radial-gradient(circle at 50% 48%,rgba(235,242,240,.18),rgba(12,16,14,.56));backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#mist.on{opacity:1}
#mistHead{position:absolute;top:10%;left:50%;transform:translateX(-50%);width:92%;text-align:center;display:flex;flex-direction:column;align-items:center}
#mistTitle{font-size:clamp(26px,4.8vw,50px);font-weight:900;letter-spacing:.14em;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.55),0 0 18px rgba(70,210,170,.45)}
#mistSub{margin-top:4px;font-size:clamp(14px,2vw,20px);font-weight:700;letter-spacing:.12em;color:#e8f6f1;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;display:none}

/* ゲーム終了時の靄＆1P/2P結果表オーバーレイ */
#resultOverlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow-y:auto;background:radial-gradient(circle at 50% 48%,rgba(235,242,240,.18),rgba(12,16,14,.62));backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#resultOverlay.open{display:flex;animation:mFade .28s ease-out}
#resultBox{width:min(580px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;margin:auto}
#resultTitle{margin:0 0 16px;font-size:clamp(26px,4.5vw,42px);font-weight:900;letter-spacing:.12em;text-shadow:3px 4px 0 var(--accent),0 8px 24px rgba(0,0,0,.55)}
.resTable{width:100%;border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.32);background:rgba(20,15,11,.74);backdrop-filter:blur(10px);box-shadow:0 12px 32px rgba(0,0,0,.45)}
.resTable th,.resTable td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;vertical-align:middle}
.resTable tr:last-child td{border-bottom:none}
.resTable th{font-size:12px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.72);background:rgba(255,255,255,.06)}
.resPlayer{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;white-space:nowrap}
.resDot{width:14px;height:14px;border-radius:4px;flex-shrink:0}
.resBalls{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:28px}
.resEmpty{font-size:12px;color:rgba(255,255,255,.45)}
.resCnt{font-weight:800;font-size:14px;text-align:right;white-space:nowrap}
.bIcon{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:900 12px/1 system-ui,sans-serif;color:#141414;box-shadow:inset -2px -3px 5px rgba(0,0,0,.35),0 2px 5px rgba(0,0,0,.45);position:relative;overflow:hidden;flex-shrink:0}
.bIcon span{width:15px;height:15px;border-radius:50%;background:#f7f4ec;display:flex;align-items:center;justify-content:center;z-index:1}
.bIcon.stripe{background:#f7f4ec}
.bIcon.stripe::before{content:"";position:absolute;left:0;right:0;top:24%;bottom:24%;background:#eab215}
#resultNote{min-height:18px;margin-top:10px;font-size:12px;font-weight:600;color:#ffe6a8}
.resBtns{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px;flex-wrap:wrap}
@media (max-height:480px){
  #resultTitle{margin-bottom:10px;font-size:24px}
  .resTable th,.resTable td{padding:8px 10px}
  .bIcon{width:24px;height:24px;font-size:11px}
  .bIcon span{width:13px;height:13px}
  .resBtns{margin-top:10px}
  .resBtns .pill{padding:10px 28px;min-width:150px;font-size:14px}
}
</style>
</head>
<body>
<div id="w" class="menu-open">
  <div id="topBar">
    <div id="views">
      <button id="menuBtn" type="button">メニュー</button>
      <button id="vTop" type="button">俯瞰（真上）</button>
      <button id="vRot90" type="button" aria-label="90度回転" title="90°回転（俯瞰モード時のみ）">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-3.2-6.9"/>
          <polyline points="21 3 21 8.5 15.5 8.5"/>
        </svg>
      </button>
      <button id="vTps" type="button">TPS視点</button>
    </div>
    <div id="hud">
      <span id="turnBadge">P1</span>
      <span id="targetBadge"><canvas id="nextBallCanvas" width="68" height="68"></canvas><span id="targetNum">1番</span></span>
      <span id="msg">ブレイクショット</span>
    </div>
    <button id="uiToggle" type="button" aria-label="表示切替" title="ボタン・表示を隠す／表示する">
      <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
  <div id="spinWrap">
    <button id="spinToggle" type="button" aria-label="撞点ドロワーを開閉" aria-expanded="false">＜</button>
    <div id="spinBox">
      <div id="spinTitle">撞点（スピン）</div>
      <div id="spin" title="ドラッグまたはクリックで撞点調整"><div id="spinRing"></div><div id="dot"></div></div>
      <div id="spinBtns">
        <button id="spL" type="button" title="左へ">◀</button>
        <button id="spU" type="button" title="上へ">▲</button>
        <button id="spC" type="button" title="中央へ">中央</button>
        <button id="spD" type="button" title="下へ">▼</button>
        <button id="spR" type="button" title="右へ">▶</button>
      </div>
    </div>
  </div>
  <div id="mist">
    <div id="mistHead">
      <div id="mistTitle">ポケットイン</div>
      <div id="mistSub"></div>
    </div>
  </div>
  <canvas id="fxCanvas"></canvas>

  <!-- ゲーム終了時の結果オーバーレイ -->
  <div id="resultOverlay">
    <div id="resultBox">
      <h2 id="resultTitle">P1 の勝利！</h2>
      <table class="resTable">
        <thead>
          <tr><th>プレイヤー</th><th>入れた球</th><th style="text-align:right">数</th></tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
      <div id="resultNote"></div>
      <div class="resBtns">
        <button id="btnResultContinue" class="pill pill-pink" type="button">続ける</button>
        <button id="btnResultQuit" class="pill pill-outline" type="button">やめる</button>
      </div>
    </div>
  </div>

  <!-- メニュー画面 -->
  <div id="menuOverlay" class="open">
    <img id="menuBg" src="menu-bg.jpg" alt="">
    <div id="menuVignette"></div>

    <!-- 1. タイトル画面 -->
    <div id="scrTitle" class="mScr on">
      <h1 class="title9">9BALL</h1>
      <div class="mStack">
        <button id="btnTitleStart" class="pill pill-pink" type="button">START</button>
      </div>
    </div>

    <!-- 2. START後の画面 -->
    <div id="scrMain" class="mScr">
      <div class="mStack" style="margin-bottom:4px">

const MQTT_BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
function encRL(n){const a=[];do{let d=n&127;n>>=7;if(n>0)d|=128;a.push(d)}while(n>0);return a}
function encStr(s){const b=new TextEncoder().encode(s);return[b.length>>8,b.length&255,...b]}
function createMqtt(url,clientId,topic,onReady,onMsg,onFail){
  let ws,buf=new Uint8Array(0),ka=null,ht=null,closed=false,ready=false;
  try{ws=new WebSocket(url,'mqtt')}catch{onFail();return null}
  ws.binaryType='arraybuffer';
  ht=setTimeout(()=>{if(!ready&&!closed){close();onFail()}},3500);
  const sendPkt=arr=>{if(ws&&ws.readyState===1)ws.send(new Uint8Array(arr))};
  ws.onopen=()=>{
    const body=[0,4,77,81,84,84,4,2,0,60,...encStr(clientId)];
    sendPkt([0x10,...encRL(body.length),...body]);
  };
  ws.onmessage=ev=>{
    const chunk=new Uint8Array(ev.data),next=new Uint8Array(buf.length+chunk.length);
    next.set(buf);next.set(chunk,buf.length);buf=next;
    while(buf.length>=2){
      const b0=buf[0];let pos=1,mult=1,rem=0,doneRL=false;
      while(pos<buf.length){const d=buf[pos++];rem+=(d&127)*mult;if((d&128)===0){doneRL=true;break}mult*=128}
      if(!doneRL||buf.length<pos+rem)break;
      const body=buf.subarray(pos,pos+rem);buf=buf.subarray(pos+rem);
      const type=b0>>4;
      if(type===2){
        if(body[1]===0){
          const sb=[0,1,...encStr(topic),0];
          sendPkt([0x82,...encRL(sb.length),...sb]);
          ka=setInterval(()=>sendPkt([0xC0,0x00]),25000);
        }else{close();onFail()}
      }else if(type===9){
        if(!ready){ready=true;if(ht){clearTimeout(ht);ht=null}onReady()}
      }else if(type===3){
        const tLen=(body[0]<<8)|body[1],qos=(b0>>1)&3;
        const txt=new TextDecoder().decode(body.subarray(2+tLen+(qos?2:0)));
        try{onMsg(JSON.parse(txt))}catch{}
      }
    }
  };
  ws.onerror=()=>{if(!ready&&!closed){close();onFail()}};
  ws.onclose=()=>{if(!ready&&!closed){close();onFail()}};
  const publish=obj=>{
    if(!ready||!ws||ws.readyState!==1)return;
    const body=[...encStr(topic),...new TextEncoder().encode(JSON.stringify(obj))];
    sendPkt([0x30,...encRL(body.length),...body]);
  };
  const close=()=>{
    closed=true;
    if(ht){clearTimeout(ht);ht=null}
    if(ka){clearInterval(ka);ka=null}
    if(ws){try{if(ws.readyState===1)sendPkt([0xE0,0x00]);ws.close()}catch{}ws=null}
  };
  return{publish,close,isReady:()=>ready};
}

  const pkt={...obj,sid:mySid};
  if(netMqtt&&netMqtt.isReady())netMqtt.publish(pkt);
  if(netBc)try{netBc.postMessage(pkt)}catch{}
}
const r3=v=>Math.round(v*1000)/1000;
function packBalls(){
  return balls.map(b=>[r3(b.x),r3(b.y),r3(b.z),r3(b.vx),r3(b.vy),r3(b.vz),b.settled?1:0]);
}
function applyBalls(arr){
  arr.forEach((d,i)=>{
    const b=balls[i];
    b.x=d[0];b.y=d[1];b.z=d[2];b.vx=d[3];b.vy=d[4];b.vz=d[5];b.settled=!!d[6];
    b.mesh.position.set(b.x,b.y,b.z);
    b.mesh.visible=!b.settled;
  });
}
function sendSyncState(type='sync',extra){
  if(!netConnected)return;
  sendNet({
    t:type,
    b:packBalls(),
    turn,winner,bih:ballInHand,lt:lockedTarget,sunkBy,msg:lastHudMsg,sa:shot.active,
    ...extra
  });
}

function handleNetData(d){
  if(!d||typeof d!=='object'||d.sid===mySid)return;
  if(d.t==='join_req'&&netIsHost&&netLobbyMode){
    if(!netConnected||guestSid===d.sid){
      netConnected=true;guestSid=d.sid;
      peerName=d.name||'';peerColor=d.color||'#e0633a';
      sendNet({t:'join_ack',name:myName,color:myColor});
      updateLobbyUI(currentRoomCode,true,true);
    }
    return;
  }
  if(d.t==='join_ack'&&!netIsHost&&!netConnected){
    if(netTimer){clearTimeout(netTimer);netTimer=null}
    if(netRetryTimer){clearInterval(netRetryTimer);netRetryTimer=null}
    netConnected=true;netLobbyMode=true;
    peerName=d.name||'';peerColor=d.color||'#2d6ef6';
    sendNet({t:'hello',name:myName,color:myColor});
    updateLobbyUI(currentRoomCode,true,false);
    showScreen('scrLobby');
    netStatus.textContent='';
    return;
  }
  if(d.t==='hello'){
    peerName=d.name||'';peerColor=d.color||(netIsHost?'#e0633a':'#2d6ef6');
    if(netLobbyMode)updateLobbyUI(currentRoomCode,true,netIsHost);
    else if(hasStarted)updateHud();
  }else if(d.t==='bye'){
    handleDisconnect();
  }else if(d.t==='start'&&!netIsHost){
    powerMult=d.pow||1;
    startOnlineMatch();
  }else if(d.t==='forfeit'){
    const pName=peerName||(netIsHost?'ゲスト':'ホスト');
    if(d.toLobby){
      hasStarted=false;rack();netLobbyMode=true;
      updateLobbyUI(currentRoomCode,true,netIsHost,`${pName} が降参しました（勝利！）`);
      setMenuOpen(true,'scrLobby');
    }else{
      closeNet();hasStarted=false;rack();
      setMenuOpen(true,'scrMain');
      netStatus.textContent=`${pName} が降参して退出しました`;
    }
  }else if(d.t==='req_continue'&&netIsHost&&winner){
    resultNote.textContent=`${peerName||'相手'} が「続ける」を希望しています`;
  }else if(d.t==='aim'){
    if(hasStarted&&!isMyTurn()&&!shot.active){
      const prevTipX=tipX,prevTipY=tipY;
      tipX=d.tipX||0;tipY=d.tipY||0;
      updateAimVisual(d.dx,d.dz,d.len);
      tipX=prevTipX;tipY=prevTipY;
    }
  }else if(d.t==='aim_end'){
    if(!isMyTurn())hideAimVisual();
  }else if(d.t==='ghost'){
    if(hasStarted&&!isMyTurn()&&ballInHand){
      ghostGrp.position.set(d.x,BALL_Y,d.z);
      ghostMat.color.setHex(d.ok?0xffffff:0xff6666);ghostMat.opacity=d.ok?.55:.32;
      ghostRingMat.color.setHex(d.ok?0x88ffbb:0xff5555);
      ghostGrp.visible=true;syncCueVisibility();
    }
  }else if(d.t==='fire'&&!netIsHost){
    hideAimVisual();
    balls[0].x=d.cx;balls[0].z=d.cz;balls[0].mesh.position.set(d.cx,BALL_Y,d.cz);
    const prevTipX=tipX,prevTipY=tipY;
    tipX=d.tipX||0;tipY=d.tipY||0;
    fireShot(d.dx,d.dz,d.spd);
    tipX=prevTipX;tipY=prevTipY;
  }else if((d.t==='sync'||d.t==='resolved')&&!netIsHost){
    applyBalls(d.b);
    const prevBih=ballInHand;
    turn=d.turn;winner=d.winner;ballInHand=d.bih;lockedTarget=d.lt;shot.active=!!d.sa;
    if(d.sunkBy)sunkBy=d.sunkBy;
    if(ballInHand&&turn===myPlayer&&!prevBih){
      ghostGrp.position.set(balls[0].x,BALL_Y,balls[0].z);ghostGrp.visible=true;
    }else if(!ballInHand){ghostGrp.visible=false}
    syncCueVisibility();
    if(d.fx&&d.fx.length>0){
      triggerPocketFx(d.fx,d.msg);
    }else if(!isFxPlaying()){
      updateHud(d.msg);
      if(winner)showResultOverlay();
    }
  }else if(d.t==='rack'&&!netIsHost){
    rack();
  }else if(d.t==='place'&&netIsHost&&turn===2&&ballInHand){
    tryPlaceCueBall(d.x,d.z);
    sendSyncState('sync');
  }else if(d.t==='shot'&&netIsHost&&turn===2&&!shot.active&&allStopped()){
    const prevTipX=tipX,prevTipY=tipY;
    tipX=d.tipX||0;tipY=d.tipY||0;
    fireShot(d.dx,d.dz,d.spd);
    sendNet({t:'fire',cx:r3(balls[0].x),cz:r3(balls[0].z),dx:d.dx,dz:d.dz,spd:d.spd,tipX,tipY});
    tipX=prevTipX;tipY=prevTipY;
  }
}
function handleDisconnect(){
  if(!netConnected)return;
  netConnected=false;guestSid=null;
  if(netLobbyMode){
    peerName='';peerColor='#e0633a';
    updateLobbyUI(currentRoomCode,false,netIsHost);
    if(!netIsHost){closeNet();netStatus.textContent='ホストが退出しました';showScreen('scrMain')}
  }else if(gameMode==='online'&&hasStarted){
    updateHud('相手との通信が切断されました');
  }
}
function connectMqttWithFallback(code,onReadyCb,onAllFailCb){
  const topic=`nineball3d/v1/${code}`;
  let idx=0;
  const tryNext=()=>{
    if(idx>=MQTT_BROKERS.length){onAllFailCb();return}
    const url=MQTT_BROKERS[idx++];
    netMqtt=createMqtt(url,`${mySid}_${idx}`,topic,onReadyCb,handleNetData,()=>{
      if(!netConnected)tryNext();
    });
  };
  tryNext();
}

function traceBall(ox,oz,dx,dz){
  let best={type:'none',t:200,hitX:ox+dx*200,hitZ:oz+dz*200};
  for(const b of balls){
    if(b.n===0||b.settled)continue;
    const fx=ox-b.x,fz=oz-b.z,B=fx*dx+fz*dz,C=fx*fx+fz*fz-4*BALL_R*BALL_R;
    if(B<0){
      const disc=B*B-C;
      if(disc>=0){
        const t=-B-Math.sqrt(disc);
        if(t>=0&&t<best.t)best={type:'ball',t,hitX:ox+t*dx,hitZ:oz+t*dz,ball:b};
      }
    }
  }
  for(const seg of wallSegs){
    const lnx=-seg.tz,lnz=seg.tx;
    const denom=dx*lnx+dz*lnz,distN=(ox-seg.ax)*lnx+(oz-seg.az)*lnz,side=distN>=0?1:-1;
    if(denom*side<-1e-6){
      const t=(side*BALL_R-distN)/denom;
      if(t>=0&&t<best.t){
        const cx=ox+t*dx,cz=oz+t*dz,px=cx-side*BALL_R*lnx,pz=cz-side*BALL_R*lnz;
        const u=((px-seg.ax)*seg.abx+(pz-seg.az)*seg.abz)/seg.l2;
        if(u>=0&&u<=1)best={type:'wall',t,hitX:cx,hitZ:cz,nx:side*lnx,nz:side*lnz};
      }
    }
    for(const[ex,ez]of[[seg.ax,seg.az],[seg.bx,seg.bz]]){
      const fx=ox-ex,fz=oz-ez,B=fx*dx+fz*dz,C=fx*fx+fz*fz-BALL_R*BALL_R;
      if(B<0){
        const disc=B*B-C;
        if(disc>=0){
          const t=-B-Math.sqrt(disc);
          if(t>=0&&t<best.t){
            const cx=ox+t*dx,cz=oz+t*dz;
            best={type:'wall',t,hitX:cx,hitZ:cz,nx:(cx-ex)/BALL_R,nz:(cz-ez)/BALL_R};
          }
        }
      }
    }
  }
  for(const[px,pz,pr]of P){
    const rp=pr-BALL_R,fx=ox-px,fz=oz-pz,B=fx*dx+fz*dz,C=fx*fx+fz*fz-rp*rp;
    if(B<0){
      const disc=B*B-C;
      if(disc>=0){
        const t=-B+Math.sqrt(disc);
        if(t>0&&t<best.t)best={type:'pocket',t,hitX:ox+t*dx,hitZ:oz+t*dz};
      }
    }
  }
  return best;
}

const UP=new V3(0,1,0),TMP_AXIS=new V3(),TMP_Q=new THREE.Quaternion();
function isMoving(b){
  return !b.settled&&(Math.abs(b.vx)>1e-3||Math.abs(b.vy)>1e-3||Math.abs(b.vz)>1e-3||Math.abs(b.wx)>1e-3||Math.abs(b.wy)>1e-3||Math.abs(b.wz)>1e-3);
}
function allStopped(){return balls.every(b=>b.settled||!isMoving(b))}
function findCueSpot(){
  const c=balls[0];
  for(let ox=-25;ox>=-46;ox-=2.5){
    for(const oz of[0,3,-3,6,-6,10,-10,15,-15]){
      if(balls.every(b=>b===c||b.settled||Math.hypot(b.x-ox,b.z-oz)>BALL_R*2.2))return[ox,oz];
    }
  }
  return[-25,0];
}
function respawnCueAsGhost(){
  const c=balls[0],[ox,oz]=findCueSpot();
  c.x=ox;c.y=BALL_Y;c.z=oz;c.vx=c.vy=c.vz=0;c.wx=c.wy=c.wz=0;c.pocket=null;c.settled=false;
  c.mesh.position.set(ox,BALL_Y,oz);
  ghostGrp.position.set(ox,BALL_Y,oz);
  ghostMat.color.setHex(0xffffff);ghostMat.opacity=.55;ghostRingMat.color.setHex(0x88ffbb);
  ghostGrp.visible=true;
  syncCueVisibility();
}
function applyTableFriction(b,dt){
  const ux=b.vx+BALL_R*b.wz,uz=b.vz-BALL_R*b.wx,u=Math.hypot(ux,uz);
  let rem=dt;
  if(u>1e-3){
    const tSlide=u/(3.5*MU_SLIDE*G),ts=Math.min(rem,tSlide),nx=ux/u,nz=uz/u;
    const dv=MU_SLIDE*G*ts,dw=2.5*dv/BALL_R;
    b.vx-=dv*nx;b.vz-=dv*nz;b.wz-=dw*nx;b.wx+=dw*nz;rem-=ts;
    if(tSlide<=dt){b.wz=-b.vx/BALL_R;b.wx=b.vz/BALL_R}
  }
  if(rem>0){
    const v=Math.hypot(b.vx,b.vz),dv=MU_ROLL*G*rem;
    if(v<=dv){b.vx=b.vz=b.wx=b.wz=0}
    else{const k=(v-dv)/v;b.vx*=k;b.vz*=k;b.wz=-b.vx/BALL_R;b.wx=b.vz/BALL_R}
  }
  const dwy=MU_SPIN*G*rem/BALL_R;
  if(Math.abs(b.wy)<=dwy*2)b.wy=0;else b.wy-=Math.sign(b.wy)*dwy*2;
}
function findPocket(x,z){
  for(const p of P){const dx=x-p[0],dz=z-p[1];if(dx*dx+dz*dz<p[2]*p[2])return p}
  return null;
}
function vanishBall(b){b.vx=b.vy=b.vz=b.wx=b.wy=b.wz=0;b.settled=true;b.mesh.visible=false}
function collideSlate(b,sdt){
  const hole=findPocket(b.x,b.z);
  const insidePlay=Math.abs(b.x)<=HX&&Math.abs(b.z)<=HZ&&!hole;
  if(insidePlay&&b.y<=BALL_Y+1e-3&&b.y>=FELT_Y-.35){
    b.y=BALL_Y;b.vy=b.vy<-24?-b.vy*.22:0;
    applyTableFriction(b,sdt);return true;
  }
  return false;
}
function collideRimAndPocket(b){
  const rim=findPocket(b.x,b.z);if(!rim)return;
  if(b.y>FELT_Y-BALL_R&&b.y<BALL_Y+.2){
    const dx=b.x-rim[0],dz=b.z-rim[1],d=Math.hypot(dx,dz);
    if(d>1e-6){
      const rx=rim[0]+dx*rim[2]/d,rz=rim[1]+dz*rim[2]/d;
      const ex=b.x-rx,ey=b.y-FELT_Y,ez=b.z-rz,ed=Math.hypot(ex,ey,ez);
      if(ed<BALL_R&&ed>1e-6){
        const nx=ex/ed,ny=ey/ed,nz=ez/ed;
        b.x=rx+nx*BALL_R;b.y=FELT_Y+ny*BALL_R;b.z=rz+nz*BALL_R;
        const vn=b.vx*nx+b.vy*ny+b.vz*nz;
        if(vn<0){const jn=-(1+.18)*vn;b.vx+=jn*nx;b.vy+=jn*ny;b.vz+=jn*nz}
      }
    }
  }
  if(b.y<=RAIL_TOP+BALL_R){
    const rWall=b.y<=FELT_Y+.05?Math.max(BALL_R+.05,rim[2]-.02-Math.max(0,-b.y)/8.9*(rim[2]*.1)):rim[2]-.02;
    const dx=b.x-rim[0],dz=b.z-rim[1],d=Math.hypot(dx,dz);
    if(d>rWall-BALL_R&&d>1e-6){
      const rx=rim[0]+dx/d*rim[2],rz=rim[1]+dz/d*rim[2];
      if(b.y<=FELT_Y+.05||Math.abs(rx)>=HX-.05||Math.abs(rz)>=HZ-.05){
        const nx=-dx/d,nz=-dz/d;
        b.x=rim[0]-nx*(rWall-BALL_R);b.z=rim[1]-nz*(rWall-BALL_R);
        const vn=b.vx*nx+b.vz*nz;
        if(vn<0){const jn=-(1+.42)*vn;b.vx+=jn*nx;b.vz+=jn*nz;b.vx*=.85;b.vz*=.85}
      }
    }
    if(b.y<=FELT_Y)b.pocket=rim;
    if(b.y<=-8.88+BALL_R){
      b.y=-8.88+BALL_R;
      if(shot.active){
        if(b.n===0)shot.scratched=true;
        else if(!shot.pocketed.includes(b.n))shot.pocketed.push(b.n);
      }
      vanishBall(b);
    }
  }
}
function collideEdgeAndRail(b){
  if(b.y>-.4&&b.y<=RAIL_TOP+BALL_R){
    for(const seg of wallSegs){
      const t=Math.max(0,Math.min(1,((b.x-seg.ax)*seg.abx+(b.z-seg.az)*seg.abz)/seg.l2));
      const px=seg.ax+t*seg.abx,pz=seg.az+t*seg.abz,dx=b.x-px,dz=b.z-pz,d2=dx*dx+dz*dz;
      if(d2<BALL_R*BALL_R&&d2>1e-9){
        const d=Math.sqrt(d2),nx=dx/d,nz=dz/d;
        b.x=px+nx*BALL_R;b.z=pz+nz*BALL_R;
        const vn=b.vx*nx+b.vz*nz;
        if(vn<0){
          if(shot.active&&shot.firstHit!==null)shot.railAfterHit=true;
          const jn=-(1+E_CUSH)*vn;b.vx+=jn*nx;b.vz+=jn*nz;
          const tx=-nz,tz=nx,vt=b.vx*tx+b.vz*tz+BALL_R*b.wy;
          const jt=Math.sign(vt)*Math.min(MU_CUSH*jn,Math.abs(vt)*2/7);
          b.vx-=jt*tx;b.vz-=jt*tz;b.wy-=2.5*jt/BALL_R;
        }
      }
    }
  }
  const hole=findPocket(b.x,b.z);
  const onRailFootprint=!hole&&(Math.abs(b.x)<=RAIL_X&&Math.abs(b.z)<=RAIL_Z)&&(Math.abs(b.x)>HX||Math.abs(b.z)>HZ);
  if(onRailFootprint){
    if(b.y>=RAIL_TOP&&b.y<=RAIL_TOP+BALL_R+.15){
      b.y=RAIL_TOP+BALL_R;b.vy=b.vy<-20?-b.vy*.35:0;b.vx*=.992;b.vz*=.992;
    }else if(b.y>-.5&&b.y<RAIL_TOP){
      if(Math.abs(b.x)>HX&&Math.abs(b.x)-HX<=Math.abs(b.z)-HZ||Math.abs(b.z)<=HZ){
        const s=Math.sign(b.x);b.x=s*HX;if(b.vx*s>0)b.vx*=-.6;
      }else{
        const s=Math.sign(b.z);b.z=s*HZ;if(b.vz*s>0)b.vz*=-.6;
      }
    }
  }
}
function collideFloor(b){
  if(b.y<=FLOOR_Y+BALL_R){
    b.y=FLOOR_Y+BALL_R;
    if(shot.active){
      if(b.n===0)shot.scratched=true;
      else if(!shot.jumped.includes(b.n))shot.jumped.push(b.n);
    }
    vanishBall(b);
  }
}
function resolveShot(){
  shot.active=false;
  let foul=null;
  if(shot.scratched)foul='手球が落ちました（スクラッチ）';
  else if(shot.jumped.length)foul='球が場外に出ました';
  else if(shot.firstHit===null)foul='的球に当たりませんでした';
  else if(shot.firstHit!==shot.targetNum)foul=`${shot.targetNum}番に最初に当たりませんでした（${shot.firstHit}番に接触）`;
  else if(shot.pocketed.length===0&&!shot.railAfterHit)foul='球に当てたあとクッションにもポケットにも入りませんでした';

  const nineIn=shot.pocketed.includes(9);
  const nineOut=shot.jumped.includes(9);
  const shooter=gameMode==='solo'?1:turn;
  for(const n of shot.pocketed){
    if(n===9&&foul)continue;
    if(!sunkBy[shooter].includes(n))sunkBy[shooter].push(n);
  }
  let nextText='';

  if(gameMode==='solo'){
    if(!foul&&nineIn){
      winner=1;ballInHand=false;ghostGrp.visible=false;syncCueVisibility();
      nextText='クリア！';
    }else if(foul){
      if(nineIn||nineOut)spotNineBall();
      ballInHand=true;respawnCueAsGhost();
      nextText=`ファウル：${foul} → フリーボール`;
    }else if(shot.pocketed.length>0){
      ballInHand=false;syncCueVisibility();
      nextText=`ナイスショット！（${shot.pocketed.join(',')}番イン）`;
    }else{
      ballInHand=false;syncCueVisibility();
      nextText='フリー練習';
    }
  }else{
    if(!foul&&nineIn){
      winner=turn;ballInHand=false;ghostGrp.visible=false;syncCueVisibility();
      nextText=`${turnLabel(turn)} の勝利！`;
    }else if(foul){
      if(nineIn||nineOut)spotNineBall();
      turn=turn===1?2:1;
      ballInHand=true;
      respawnCueAsGhost();
      nextText=`ファウル：${foul} → ${turnLabel(turn)} フリーボール`;
    }else if(shot.pocketed.length>0){
      ballInHand=false;syncCueVisibility();
      nextText=`ナイスショット！（${shot.pocketed.join(',')}番イン）${turnLabel(turn)} 続行`;
    }else{
      turn=turn===1?2:1;
      ballInHand=false;syncCueVisibility();
      nextText=`${turnLabel(turn)} のターン`;
    }
  }

  if(shot.pocketed.length>0){
    triggerPocketFx([...shot.pocketed],nextText);
  }else{
    lockedTarget=null;
    updateHud(nextText);
    if(winner)showResultOverlay();
  }
  if(gameMode==='online'&&netIsHost){
    sendSyncState('resolved',{fx:[...shot.pocketed]});
  }
  if(gameMode==='cpu'&&turn===2&&!winner)cpuTimer=.95;
}

// ---------- CPU対戦 ----------
function pathClear(x1,z1,x2,z2,ignoreA,ignoreB){
  const abx=x2-x1,abz=z2-z1,l2=abx*abx+abz*abz;if(l2<1e-4)return true;
  for(const b of balls){
    if(b===ignoreA||b===ignoreB||b.settled)continue;
    const t=Math.max(0,Math.min(1,((b.x-x1)*abx+(b.z-z1)*abz)/l2));
    if(Math.hypot(b.x-(x1+t*abx),b.z-(z1+t*abz))<BALL_R*2.05)return false;
  }
  return true;
}
function runCpuShot(){
  const low=lowestBall();if(!low)return;
  const target=balls[low],c=balls[0];
  let best=null;
  if(ballInHand){
    for(const[px,pz]of P){
      const vx=px-target.x,vz=pz-target.z,vl=Math.hypot(vx,vz);if(vl<1e-3)continue;
      const ux=vx/vl,uz=vz/vl,gx=target.x-ux*BALL_R*2,gz=target.z-uz*BALL_R*2;
      if(!pathClear(target.x,target.z,px,pz,target,c))continue;
      for(const dist of[13,9,18,7]){
        const cx=gx-ux*dist,cz=gz-uz*dist;
        if(canPlaceCueBall(cx,cz)&&pathClear(cx,cz,gx,gz,c,target)){best={cx,cz};break}
      }
      if(best)break;
    }
    if(best)tryPlaceCueBall(best.cx,best.cz);
    else{const[ox,oz]=findCueSpot();tryPlaceCueBall(ox,oz)}
    best=null;
  }
  for(const[px,pz]of P){
    const vx=px-target.x,vz=pz-target.z,vl=Math.hypot(vx,vz);if(vl<1e-3)continue;
    const ux=vx/vl,uz=vz/vl,gx=target.x-ux*BALL_R*2,gz=target.z-uz*BALL_R*2;
    const ax=gx-c.x,az=gz-c.z,al=Math.hypot(ax,az);if(al<1e-3)continue;
    const dot=(ax/al)*ux+(az/al)*uz;if(dot<.28)continue;
    let score=dot*50-vl*.4-al*.2;
    if(pathClear(c.x,c.z,gx,gz,c,target))score+=60;
    if(pathClear(target.x,target.z,px,pz,target,c))score+=60;
    if(!best||score>best.score)best={dx:ax/al,dz:az/al,spd:Math.min(130,Math.max(68,60+al*.7)),score};
  }
  if(!best){const dx=target.x-c.x,dz=target.z-c.z,l=Math.hypot(dx,dz)||1;best={dx:dx/l,dz:dz/l,spd:85}}
  const err=(rnd()-.5)*.024,cs=Math.cos(err),sn=Math.sin(err);
  fireShot(best.dx*cs-best.dz*sn,best.dx*sn+best.dz*cs,best.spd);
}

function fireShot(dx,dz,spd){
  const c=balls[0];
  c.vx=dx*spd;c.vz=dz*spd;c.settled=false;
  const rx=-dz,rz=dx,wMag=2.5*spd/BALL_R*SPIN_SCALE;
  c.wx=-wMag*tipY*rx;c.wz=-wMag*tipY*rz;c.wy=wMag*tipX;
  ballInHand=false;ghostGrp.visible=false;syncCueVisibility();
  const curTarget=lowestBall();
  lockedTarget=curTarget;
  shot.active=true;shot.targetNum=curTarget;shot.firstHit=null;
  shot.railAfterHit=false;shot.pocketed=[];shot.jumped=[];shot.scratched=false;
  updateHud(`${turnLabel(turn)} ショット中...`);
}

function stepPhysics(dt){
  const SUB=24,sdt=dt/SUB;
  for(let s=0;s<SUB;s++){
    for(const b of balls){
      if(b.settled)continue;
      const wasOnSlate=collideSlate(b,sdt);
      if(wasOnSlate){b.x+=b.vx*sdt;b.z+=b.vz*sdt;collideSlate(b,0)}
      else{b.vy-=G*sdt;b.x+=b.vx*sdt;b.y+=b.vy*sdt;b.z+=b.vz*sdt;collideSlate(b,sdt)}
      if(!b.settled){collideEdgeAndRail(b);collideRimAndPocket(b);if(!b.settled)collideFloor(b)}
      const w=Math.hypot(b.wx,b.wy,b.wz);
      if(w>1e-4&&!b.settled){
        TMP_AXIS.set(b.wx/w,b.wy/w,b.wz/w);TMP_Q.setFromAxisAngle(TMP_AXIS,w*sdt);
        b.mesh.quaternion.premultiply(TMP_Q);
      }
    }
    for(let i=0;i<balls.length;i++){
      const a=balls[i];if(a.settled)continue;
      for(let j=i+1;j<balls.length;j++){
        const b=balls[j];if(b.settled)continue;
        const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,d2=dx*dx+dy*dy+dz*dz,minD=BALL_R*2;
        if(d2<minD*minD&&d2>1e-8){
          const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,nz=dz/d,ov=(minD-d)*.5;
          a.x-=nx*ov;a.y-=ny*ov;a.z-=nz*ov;b.x+=nx*ov;b.y+=ny*ov;b.z+=nz*ov;
          if(shot.active&&shot.firstHit===null){
            if(a.n===0&&b.n>0)shot.firstHit=b.n;else if(b.n===0&&a.n>0)shot.firstHit=a.n;
          }
          const rvx=b.vx-a.vx,rvy=b.vy-a.vy,rvz=b.vz-a.vz,vn=rvx*nx+rvy*ny+rvz*nz;
          if(vn<0){
            const jn=-(1+E_BALL)*vn*.5;
            a.vx-=jn*nx;a.vy-=jn*ny;a.vz-=jn*nz;b.vx+=jn*nx;b.vy+=jn*ny;b.vz+=jn*nz;
            const wAx=a.wy*nz-a.wz*ny,wAy=a.wz*nx-a.wx*nz,wAz=a.wx*ny-a.wy*nx;
            const wBx=b.wy*nz-b.wz*ny,wBy=b.wz*nx-b.wx*nz,wBz=b.wx*ny-b.wy*nx;
            const cvx=rvx-BALL_R*(wBx+wAx),cvy=rvy-BALL_R*(wBy+wAy),cvz=rvz-BALL_R*(wBz+wAz);
            const cvn=cvx*nx+cvy*ny+cvz*nz;
            const vtx=cvx-cvn*nx,vty=cvy-cvn*ny,vtz=cvz-cvn*nz,vt=Math.hypot(vtx,vty,vtz);
            if(vt>1e-4){
              const tx=vtx/vt,ty=vty/vt,tz=vtz/vt,jt=Math.min(MU_BB*jn,vt/7);
              a.vx+=jt*tx;a.vy+=jt*ty;a.vz+=jt*tz;b.vx-=jt*tx;b.vy-=jt*ty;b.vz-=jt*tz;
              const dw=2.5*jt/BALL_R;
              a.wx+=dw*(ny*tz-nz*ty);a.wy+=dw*(nz*tx-nx*tz);a.wz+=dw*(nx*ty-ny*tx);
              b.wx+=dw*(ny*tz-nz*ty);b.wy+=dw*(nz*tx-nx*tz);b.wz+=dw*(nx*ty-ny*tx);
            }
          }
        }
      }
    }
  }
  for(const b of balls){if(!b.settled)b.mesh.position.set(b.x,b.y,b.z)}
  if(shot.active&&allStopped()&&(gameMode!=='online'||netIsHost))resolveShot();
}

// ---------- 右端スライド式 撞点（スピン）調整ドロワー ----------
let tipX=0,tipY=0;
const spinWrap=document.getElementById('spinWrap'),spinToggle=document.getElementById('spinToggle');
const spinEl=document.getElementById('spin'),dotEl=document.getElementById('dot');
spinToggle.addEventListener('click',()=>{
  const open=spinWrap.classList.toggle('open');
  spinToggle.textContent=open?'＞':'＜';
  spinToggle.setAttribute('aria-expanded',String(open));
});
function applyTipNorm(nx,ny){
  const d=Math.hypot(nx,ny);if(d>.75){nx*=.75/d;ny*=.75/d}
  tipX=nx*.8;tipY=ny*.8;
  dotEl.style.left=`${50+nx*42}%`;dotEl.style.top=`${50-ny*42}%`;
}
function resetSpin(){applyTipNorm(0,0)}
function nudgeSpin(dx,dy){applyTipNorm(tipX/.8+dx,tipY/.8+dy)}
function setSpinFromEvent(e){
  const r=spinEl.getBoundingClientRect();
  let nx,ny;
  if(box.classList.contains('force-land')){
    nx=((e.clientY-r.top)/r.height)*2-1;
    ny=((e.clientX-r.left)/r.width)*2-1;
  }else{
    nx=((e.clientX-r.left)/r.width)*2-1;
    ny=-(((e.clientY-r.top)/r.height)*2-1);
  }
  applyTipNorm(nx,ny);
}
let spinDragId=null;
spinEl.addEventListener('pointerdown',e=>{e.stopPropagation();spinEl.setPointerCapture(e.pointerId);spinDragId=e.pointerId;setSpinFromEvent(e)});
spinEl.addEventListener('pointermove',e=>{if(e.pointerId===spinDragId)setSpinFromEvent(e)});
const spinEnd=e=>{if(e.pointerId===spinDragId)spinDragId=null};
spinEl.addEventListener('pointerup',spinEnd);spinEl.addEventListener('pointercancel',spinEnd);
spinEl.addEventListener('dblclick',e=>{e.stopPropagation();resetSpin()});
document.getElementById('spL').addEventListener('click',()=>nudgeSpin(-.14,0));
document.getElementById('spR').addEventListener('click',()=>nudgeSpin(.14,0));
document.getElementById('spU').addEventListener('click',()=>nudgeSpin(0,.14));
document.getElementById('spD').addEventListener('click',()=>nudgeSpin(0,-.14));
document.getElementById('spC').addEventListener('click',resetSpin);

// ---------- カメラ・視点モード（俯瞰・俯瞰専用90°回転・TPS追従）----------
const tg=new V3(0,-7,0);let th=-.7,ph=1.02,rad=175,tpsMode=false;
const btnTop=document.getElementById('vTop'),btnRot90=document.getElementById('vRot90'),btnTps=document.getElementById('vTps');
const syncViewBtn=()=>{
  const isOverhead=!tpsMode&&ph<.05;
  btnTop.classList.toggle('on',isOverhead);
  btnTps.classList.toggle('on',tpsMode);
  btnRot90.disabled=!isOverhead;
};
const place=()=>{cam.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tg)};
function fitOverheadRad(){
  const tanY=Math.tan(cam.fov*PI/360),tanX=tanY*(cam.aspect||1.6);
  const horiz=Math.abs(Math.cos(th))>.5;
  const hx=horiz?66:41,hz=horiz?41:66;
  rad=Math.max(hx/tanX,hz/tanY);
}
btnTop.addEventListener('click',()=>{
  tpsMode=false;tg.set(0,0,0);th=0;ph=.001;fitOverheadRad();syncViewBtn();
});
btnRot90.addEventListener('click',()=>{
  if(tpsMode||ph>=.05)return;
  th+=PI/2;fitOverheadRad();syncViewBtn();
});
btnTps.addEventListener('click',()=>{
  tpsMode=true;
  const c=balls[0],tx=c.x<12?25:0,tz=0;
  let dx=tx-c.x,dz=tz-c.z,l=Math.hypot(dx,dz);if(l<1e-3){dx=1;dz=0;l=1}
  tg.set(c.x,(c.y>=0?c.y:BALL_Y)+1.5,c.z);
  th=Math.atan2(-dx/l,-dz/l);ph=1.24;rad=52;
  syncViewBtn();
});

const ptr=new Map(),ray=new THREE.Raycaster(),feltPlane=new THREE.Plane(UP,-BALL_Y),hitPt=new V3();
let pd=0,aimId=null,aimPull=new V3(),tapInfo=null;
function tableHit(e){
  const[ex,ey]=evXY(e);
  const w=box.clientWidth||1,h=box.clientHeight||1;
  ray.setFromCamera({x:(ex/w)*2-1,y:-(ey/h)*2+1},cam);
  return ray.ray.intersectPlane(feltPlane,hitPt);
}
function canPlaceCueBall(x,z){
  if(x<-50+BALL_R||x>50-BALL_R||Math.abs(z)>25-BALL_R)return false;
  if(findPocket(x,z))return false;
  return balls.every(b=>b===balls[0]||b.settled||Math.hypot(b.x-x,b.z-z)>=BALL_R*2.05);
}
function isMyTurn(){
  if(gameMode==='cpu')return turn===1;
  if(gameMode==='online')return turn===myPlayer;
  return true;
}
function updateGhostCursor(e){
  if(menuOpen||!isMyTurn()||!ballInHand||winner||!allStopped()||isFxPlaying()||aimId!==null||ptr.size>0||e.target.closest('#topBar,#spinWrap,#resultOverlay')){
    syncCueVisibility();return;
  }
  if(!tableHit(e)){syncCueVisibility();return}
  if(Math.abs(hitPt.x)<=50&&Math.abs(hitPt.z)<=25){
    const ok=canPlaceCueBall(hitPt.x,hitPt.z);
    ghostGrp.position.set(hitPt.x,BALL_Y,hitPt.z);
    ghostMat.color.setHex(ok?0xffffff:0xff6666);ghostMat.opacity=ok?.55:.32;
    ghostRingMat.color.setHex(ok?0x88ffbb:0xff5555);
    ghostGrp.visible=true;syncCueVisibility();
    box.style.cursor=ok?'pointer':'not-allowed';
    if(gameMode==='online'&&performance.now()-ghostSyncAcc>65){
      ghostSyncAcc=performance.now();
      sendNet({t:'ghost',x:r3(hitPt.x),z:r3(hitPt.z),ok});
    }
  }
}
function tryPlaceCueBall(x,z){
  if(!canPlaceCueBall(x,z))return false;
  const c=balls[0];
  c.x=x;c.y=BALL_Y;c.z=z;c.vx=c.vy=c.vz=0;c.wx=c.wy=c.wz=0;c.pocket=null;c.settled=false;
  c.mesh.position.set(c.x,c.y,c.z);
  ballInHand=false;ghostGrp.visible=false;syncCueVisibility();
  box.style.cursor='grab';
  updateHud(`${turnLabel(turn)} のターン`);
  return true;
}
function updateAimVisual(dx,dz,len){
  const c=balls[0];
  if(len<.8){hideAimVisual();return}
  const nx=dx/len,nz=dz/len,rx=-nz,rz=nx;
  if(guideMode===0){
    aimLine.visible=aimLine2.visible=aimRing.visible=false;
  }else if(guideMode===1){
    const pos=aimLine.geometry.attributes.position;
    pos.setXYZ(0,c.x,BALL_Y,c.z);pos.setXYZ(1,c.x+nx*32,BALL_Y,c.z+nz*32);pos.needsUpdate=true;
    aimLine.computeLineDistances();aimLine.visible=true;
    aimLine2.visible=aimRing.visible=false;
  }else{
    const hit=traceBall(c.x,c.z,nx,nz);
    const pos=aimLine.geometry.attributes.position;
    pos.setXYZ(0,c.x,BALL_Y,c.z);pos.setXYZ(1,hit.hitX,BALL_Y,hit.hitZ);pos.needsUpdate=true;
    aimLine.computeLineDistances();aimLine.visible=true;
    aimRing.position.set(hit.hitX,FELT_Y+.03,hit.hitZ);
    aimRing.visible=hit.type==='ball'||hit.type==='wall';
    if(guideMode===3&&(hit.type==='ball'||hit.type==='wall')){
      const pos2=aimLine2.geometry.attributes.position;
      if(hit.type==='ball'){
        const bx=hit.ball.x-hit.hitX,bz=hit.ball.z-hit.hitZ,bl=Math.hypot(bx,bz)||1;
        pos2.setXYZ(0,hit.ball.x,BALL_Y,hit.ball.z);
        pos2.setXYZ(1,hit.ball.x+bx/bl*32,BALL_Y,hit.ball.z+bz/bl*32);
      }else{
        const dot=nx*hit.nx+nz*hit.nz,rx2=nx-2*dot*hit.nx,rz2=nz-2*dot*hit.nz;
        pos2.setXYZ(0,hit.hitX,BALL_Y,hit.hitZ);
        pos2.setXYZ(1,hit.hitX+rx2*32,BALL_Y,hit.hitZ+rz2*32);
      }
      pos2.needsUpdate=true;aimLine2.computeLineDistances();aimLine2.visible=true;
    }else aimLine2.visible=false;
  }
  const pull=Math.min(22,len),sx=tipX*BALL_R*.6,sy=tipY*BALL_R*.6;
  cueGrp.position.set(c.x-nx*(BALL_R+1.5+pull*.45)+rx*sx,BALL_Y+.8+sy,c.z-nz*(BALL_R+1.5+pull*.45)+rz*sx);
  cueGrp.lookAt(c.x+rx*sx,BALL_Y+sy,c.z+rz*sx);cueGrp.rotateY(PI);cueGrp.rotateX(.055);
  cueGrp.visible=true;
}
box.addEventListener('pointerdown',e=>{
  if(menuOpen||e.target.closest('#topBar,#spinWrap,#menuOverlay,#resultOverlay')||isFxPlaying())return;
  box.setPointerCapture(e.pointerId);
  if(ptr.size===0&&!winner&&isMyTurn()&&allStopped()&&!ballInHand&&!balls[0].settled&&balls[0].y>=0&&tableHit(e)){
    const c=balls[0];
    if(Math.hypot(hitPt.x-c.x,hitPt.z-c.z)<=5.5){
      aimId=e.pointerId;aimPull.set(0,0,0);ghostGrp.visible=false;syncCueVisibility();return;
    }
  }
  const[ex,ey]=evXY(e);
  if(ptr.size===0)tapInfo={id:e.pointerId,x:ex,y:ey,moved:false};
  else tapInfo=null;
  ptr.set(e.pointerId,[ex,ey]);pd=0;
});
box.addEventListener('pointermove',e=>{
  if(menuOpen)return;
  if(e.pointerId===aimId&&tableHit(e)){
    const c=balls[0],dx=c.x-hitPt.x,dz=c.z-hitPt.z,len=Math.hypot(dx,dz);
    aimPull.set(dx,0,dz);updateAimVisual(dx,dz,len);
    if(gameMode==='online'&&performance.now()-aimSyncAcc>65){
      aimSyncAcc=performance.now();
      sendNet({t:'aim',dx:r3(dx),dz:r3(dz),len:r3(len),tipX:r3(tipX),tipY:r3(tipY)});
    }
    return;
  }
  const[ex,ey]=evXY(e);
  if(tapInfo&&e.pointerId===tapInfo.id&&Math.hypot(ex-tapInfo.x,ey-tapInfo.y)>6)tapInfo.moved=true;
  const o=ptr.get(e.pointerId);
  if(!o){updateGhostCursor(e);return}
  if(ptr.size==1){th-=(ex-o[0])*.006;ph=Math.min(1.5,Math.max(.001,ph-(ey-o[1])*.006));syncViewBtn()}
  ptr.set(e.pointerId,[ex,ey]);
  if(ptr.size==2){const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)rad=Math.min(380,Math.max(25,rad*pd/d));pd=d}
});
const up=e=>{
  if(e.pointerId===aimId){
    const len=Math.hypot(aimPull.x,aimPull.z);
    if(len>=.8&&!winner&&!menuOpen&&isMyTurn()){
      const dx=aimPull.x/len,dz=aimPull.z/len;
      const spd=Math.min(22,len)/22*BASE_SHOT_SPD*powerMult;
      if(gameMode==='online'&&!netIsHost){
        sendNet({t:'shot',dx:r3(dx),dz:r3(dz),spd:r3(spd),tipX:r3(tipX),tipY:r3(tipY)});
      }else{
        fireShot(dx,dz,spd);
        if(gameMode==='online'&&netIsHost){
          sendNet({t:'fire',cx:r3(balls[0].x),cz:r3(balls[0].z),dx:r3(dx),dz:r3(dz),spd:r3(spd),tipX:r3(tipX),tipY:r3(tipY)});
        }
      }
    }else if(gameMode==='online'){
      sendNet({t:'aim_end'});
    }
    aimId=null;hideAimVisual();return;
  }
  if(tapInfo&&e.pointerId===tapInfo.id&&!tapInfo.moved&&!menuOpen&&isMyTurn()&&ballInHand&&!winner&&allStopped()&&tableHit(e)){
    if(gameMode==='online'&&!netIsHost){
      if(tryPlaceCueBall(hitPt.x,hitPt.z)){
        sendNet({t:'place',x:r3(hitPt.x),z:r3(hitPt.z)});
      }
    }else if(tryPlaceCueBall(hitPt.x,hitPt.z)&&gameMode==='online'){
      sendSyncState('sync');
    }
  }
  if(tapInfo&&e.pointerId===tapInfo.id)tapInfo=null;
  ptr.delete(e.pointerId);pd=0;
};
box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
box.addEventListener('wheel',e=>{if(menuOpen)return;e.preventDefault();rad=Math.min(380,Math.max(25,rad*(1+e.deltaY*.001)))},{passive:false});
addEventListener('keydown',e=>{
  if((e.key==='r'||e.key==='R')&&!menuOpen&&!isFxPlaying()){
    if(gameMode==='online'){if(netIsHost){rack();sendNet({t:'rack'})}}
    else rack();
  }
});

function fit(){
  const forceLand=mobileLandActive&&isMobileDevice&&window.innerHeight>window.innerWidth;
  box.classList.toggle('force-land',forceLand);
  const w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;
  R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<1?55:32;cam.updateProjectionMatrix();
  hudR.setSize(w,h,false);hudCam.aspect=w/h;hudCam.updateProjectionMatrix();
}
new ResizeObserver(fit).observe(box);
addEventListener('resize',fit);
addEventListener('orientationchange',fit);
document.addEventListener('fullscreenchange',fit);
fit();rack();syncViewBtn();
let prev=performance.now();
(function loop(now){
  const dt=Math.min(.033,(now-prev)/1000);prev=now;
  stepPhysics(dt);
  if(gameMode==='online'&&netIsHost&&shot.active){
    syncAcc+=dt;if(syncAcc>=.16){syncAcc=0;sendSyncState('sync')}
  }
  if(menuOpen){
    th+=dt*.14;
  }else{
    if(tpsMode){
      const c=balls[0],k=Math.min(1,dt*10),ty=(c.y>=0?c.y:BALL_Y)+1.5;
      tg.x+=(c.x-tg.x)*k;tg.y+=(ty-tg.y)*k;tg.z+=(c.z-tg.z)*k;
    }
    if(gameMode==='cpu'&&turn===2&&!winner&&!shot.active&&!isFxPlaying()&&allStopped()){
      if(cpuTimer>0){cpuTimer-=dt;if(cpuTimer<=0)runCpuShot()}
    }
  }
  place();R.render(scene,cam);
  updatePocketFx(dt);
  if(!menuOpen&&!isFxPlaying()&&!winner&&targetBadge.style.display!=='none')updateNextBallPreview(displayTargetBall(),now*.001);
  requestAnimationFrame(loop);
})(prev);
window.TABLE={unit:'inch',W:100,H:50,BALL_R,pockets:P,cushions:CU,balls,rack};
</script>
</body>
